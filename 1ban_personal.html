<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 상식퀴즈 성장 리포트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
margin:0;background:#eef1f6;color:#1a1a2e;padding:20px}
.wrap{max-width:720px;margin:0 auto}
.gate{background:#fff;border-radius:18px;padding:30px 26px;box-shadow:0 4px 20px rgba(0,0,0,.08);
max-width:400px;margin:8vh auto 0}
.gate h1{font-size:20px;margin:0 0 6px}
.gate p{font-size:13px;color:#778;margin:0 0 20px;line-height:1.5}
.gate label{display:block;font-size:12px;color:#667;margin:14px 0 5px;font-weight:600}
.gate input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid #dde;
border-radius:10px;background:#fafbff}
.gate input:focus{outline:none;border-color:#2f6fed;background:#fff}
.gate button{width:100%;margin-top:20px;font:inherit;font-size:15px;font-weight:600;
background:#2f6fed;color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
.gate button:active{background:#245ad0}
.err{color:#d33;font-size:13px;margin-top:12px;min-height:18px}
.hint{font-size:11px;color:#9aa;margin-top:16px;line-height:1.5}
.report{display:none}
h1.title{font-size:22px;margin:0 0 2px}
.sub{color:#667;font-size:13px;margin-bottom:18px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.card{flex:1;min-width:120px;background:#fff;border-radius:14px;padding:15px 16px;
box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .lbl{font-size:11px;color:#889;margin-bottom:6px}
.card .val{font-size:24px;font-weight:700}
.card .val small{font-size:13px;font-weight:600;color:#2ba24c;margin-left:5px}
.panel{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;
box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel h2{font-size:15px;margin:0 0 3px}
.panel p.note{font-size:12px;color:#889;margin:0 0 12px}
.logout{display:inline-block;font-size:12px;color:#889;background:none;border:1px solid #dde;
border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:16px}
.legend{font-size:12px;color:#667;margin:8px 0 0}
.legend b{color:#2f6fed}.legend i{color:#9aa;font-style:normal}
</style></head><body><div class="wrap">

<div class="gate" id="gate">
  <h1>📊 내 성장 리포트</h1>
  <p>영어상식 퀴즈 1~4차 나의 기록이에요.<br>본인 <b>학번</b>과 <b>이름</b>을 넣으면 내 것만 볼 수 있어요.</p>
  <label>학번 (예: 2109)</label>
  <input id="gid" inputmode="numeric" maxlength="4" placeholder="네 자리 학번" autocomplete="off">
  <label>이름</label>
  <input id="gname" placeholder="이름" autocomplete="off">
  <button onclick="login()">내 리포트 보기</button>
  <div class="err" id="err"></div>
  <div class="hint">이름은 확인용으로만 쓰이고 화면·주소에 저장되지 않아요. 본인만 열 수 있게 하는 잠금장치예요.</div>
</div>

<div class="report" id="report">
  <button class="logout" onclick="logout()">← 다른 학번으로</button>
  <h1 class="title" id="rtitle"></h1>
  <div class="sub">영어상식 퀴즈 1~4차 · 반복 학습에 따른 나의 변화</div>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <h2>회차별 정답률 추이</h2>
    <p class="note">전체 문항 대비 내가 맞힌 비율. 회를 거듭할수록 어떻게 변했는지 볼 수 있어요.</p>
    <canvas id="cLine" height="150"></canvas>
    <p class="legend"><b>━ 나</b>　<i>┈ 우리 반 평균</i></p>
  </div>
  <div class="panel">
    <h2>회차별 응답 문항 수</h2>
    <p class="note">매 회차에 몇 문항이나 답했는지. 참여도가 늘고 있는지 보여줘요.</p>
    <canvas id="cBar" height="140"></canvas>
  </div>
</div>

</div>
<script>
const SALT="sangsik2026";
const DATA={"class": "1반", "rounds": ["1차", "2차", "3차", "4차"], "means_cov": [28.4, 43.0, 48.2, 61.0], "means_acc": [53.0, 63.7, 69.0, 75.9], "students": [{"id": "2101", "h": "53ba4a86e1822a52", "cov": [22.4, 30.6, 32.7, 40.8], "acc": [39.3, 50.0, 55.2, 58.8], "ans": [28, 30, 29, 34]}, {"id": "2102", "h": "4ca5d6740b398429", "cov": [40.8, 55.1, 61.2, 77.6], "acc": [66.7, 73.0, 81.1, 84.4], "ans": [30, 37, 37, 45]}, {"id": "2103", "h": "f790d8a5a7f7306c", "cov": [0.0, 0.0, 4.1, 10.2], "acc": [0.0, 0.0, 50.0, 22.7], "ans": [2, 4, 4, 22]}, {"id": "2104", "h": "352d4cb32dfc3d10", "cov": [20.4, 24.5, 38.8, 51.0], "acc": [47.6, 46.1, 67.9, 75.8], "ans": [21, 26, 28, 33]}, {"id": "2105", "h": "f678c9525bf7cc5c", "cov": [32.7, 59.2, 65.3, 63.3], "acc": [64.0, 76.3, 78.0, 77.5], "ans": [25, 38, 41, 40]}, {"id": "2106", "h": "de39fde1a51a3fbd", "cov": [28.6, 36.7, 46.9, 79.6], "acc": [56.0, 58.1, 71.9, 95.1], "ans": [25, 31, 32, 41]}, {"id": "2107", "h": "11a753c23eb4a845", "cov": [24.5, 20.4, 38.8, 55.1], "acc": [52.2, 62.5, 61.3, 75.0], "ans": [23, 16, 31, 36]}, {"id": "2108", "h": "475b3dfa0a5668e0", "cov": [38.8, 65.3, 57.1, 77.6], "acc": [65.5, 76.2, 73.7, 86.4], "ans": [29, 42, 38, 44]}, {"id": "2109", "h": "f89ead6c684f1ef2", "cov": [77.6, 93.2, 91.1, 91.1], "acc": [84.4, 93.2, 91.1, 91.1], "ans": [45, 59, 56, 56]}, {"id": "2110", "h": "28429a386f357afa", "cov": [38.8, 75.5, 67.3, 94.3], "acc": [70.4, 88.1, 78.6, 94.3], "ans": [27, 42, 42, 53]}, {"id": "2111", "h": "0390b6502dcd10a1", "cov": [22.4, 32.7, 36.7, 63.3], "acc": [50.0, 57.1, 66.7, 83.8], "ans": [22, 28, 27, 37]}, {"id": "2114", "h": "0fa3edfa247f4aa1", "cov": [10.2, 20.4, 20.4, 24.5], "acc": [15.6, 27.0, 26.3, 41.4], "ans": [32, 37, 38, 29]}, {"id": "2115", "h": "6a92e3d4c85b352b", "cov": [26.5, 51.0, 75.5, 98.0], "acc": [54.2, 78.1, 88.1, 98.0], "ans": [24, 32, 42, 49]}, {"id": "2116", "h": "b702c9bb98d63291", "cov": [16.3, 34.7, 30.6, 49.0], "acc": [38.1, 65.4, 57.7, 70.6], "ans": [21, 26, 26, 34]}, {"id": "2117", "h": "e42078782f7e210b", "cov": [55.1, 61.2, 51.0, 59.2], "acc": [84.4, 88.2, 73.5, 82.9], "ans": [32, 34, 34, 35]}, {"id": "2118", "h": "2a795a5d74a81021", "cov": [26.5, 42.9, 46.9, 53.1], "acc": [72.2, 77.8, 79.3, 81.2], "ans": [18, 27, 29, 32]}, {"id": "2119", "h": "5f334502233840ca", "cov": [32.7, 49.0, 55.1, 65.3], "acc": [64.0, 80.0, 77.1, 84.2], "ans": [25, 30, 35, 38]}, {"id": "2120", "h": "191bd495c3726732", "cov": [30.6, 63.3, 61.2, 85.7], "acc": [53.6, 81.6, 81.1, 91.3], "ans": [28, 38, 37, 46]}, {"id": "2121", "h": "1d341a3574009ec4", "cov": [22.4, 30.6, 34.7, 40.8], "acc": [42.3, 53.6, 58.6, 64.5], "ans": [26, 28, 29, 31]}, {"id": "2122", "h": "e3cc45657e715ae0", "cov": [8.2, 34.7, 40.8, 24.5], "acc": [21.1, 58.6, 64.5, 46.1], "ans": [19, 29, 31, 26]}, {"id": "2123", "h": "1338ec4724c48d66", "cov": [38.8, 51.0, 67.3, 85.7], "acc": [76.0, 71.4, 82.5, 87.5], "ans": [25, 35, 40, 48]}, {"id": "2124", "h": "bcfdffae891de8e5", "cov": [20.4, 24.5, 28.6, 44.9], "acc": [43.5, 44.4, 51.9, 68.8], "ans": [23, 27, 27, 32]}, {"id": "2126", "h": "e02c70baac987797", "cov": [30.6, 46.9, 59.2, 73.5], "acc": [71.4, 74.2, 82.9, 90.0], "ans": [21, 31, 35, 40]}, {"id": "2127", "h": "7d7e8728f0a26d0b", "cov": [28.6, 53.1, 71.4, 86.3], "acc": [51.9, 66.7, 79.5, 86.3], "ans": [27, 39, 44, 51]}, {"id": "2128", "h": "509150cb938a799a", "cov": [16.3, 18.4, 22.4, 30.6], "acc": [40.0, 45.0, 45.8, 60.0], "ans": [20, 20, 24, 25]}]};
const byId={}; DATA.students.forEach(s=>byId[s.id]=s);

async function h16(name){
  const key=(name||"").replace(/\s+/g,"");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+key));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
}
async function login(){
  const id=document.getElementById("gid").value.trim();
  const nm=document.getElementById("gname").value.trim();
  const err=document.getElementById("err");
  const s=byId[id];
  if(!s){err.textContent="그 학번은 이 반 기록에 없어요. 다시 확인해 주세요.";return;}
  if(!nm){err.textContent="이름을 입력해 주세요.";return;}
  const hv=await h16(nm);
  if(hv!==s.h){err.textContent="학번과 이름이 맞지 않아요.";return;}
  err.textContent="";
  show(s);
}
function logout(){
  document.getElementById("report").style.display="none";
  document.getElementById("gate").style.display="block";
  document.getElementById("gname").value="";
  if(lineC)lineC.destroy(); if(barC)barC.destroy(); lineC=barC=null;
}
let lineC=null,barC=null;
function show(s){
  document.getElementById("gate").style.display="none";
  const rep=document.getElementById("report"); rep.style.display="block";
  document.getElementById("rtitle").textContent=`${s.id} · 나의 기록`;
  const c0=s.cov[0], c3=s.cov[3], chg=+(c3-c0).toFixed(1);
  const a0=s.ans[0], a3=s.ans[3];
  document.getElementById("cards").innerHTML=`
   <div class="card"><div class="lbl">1차 정답률</div><div class="val">${c0}%</div></div>
   <div class="card"><div class="lbl">4차 정답률</div><div class="val">${c3}%</div></div>
   <div class="card"><div class="lbl">성장</div><div class="val">${chg>=0?'+':''}${chg}<small>%p</small></div></div>
   <div class="card"><div class="lbl">응답 문항</div><div class="val">${a0}→${a3}</div></div>`;

  lineC=new Chart(document.getElementById("cLine"),{type:"line",
    data:{labels:DATA.rounds,datasets:[
      {label:"나",data:s.cov,borderColor:"#2f6fed",borderWidth:3.5,
       pointRadius:5,pointBackgroundColor:"#2f6fed",tension:.3,fill:false},
      {label:"우리 반 평균",data:DATA.means_cov,borderColor:"#9aa",borderWidth:2,
       borderDash:[5,4],pointRadius:0,tension:.3,fill:false}
    ]},
    options:{plugins:{legend:{display:false},
      tooltip:{callbacks:{label:i=>`${i.dataset.label}: ${i.formattedValue}%`}}},
      scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%"}}}}});

  barC=new Chart(document.getElementById("cBar"),{type:"bar",
    data:{labels:DATA.rounds,datasets:[
      {label:"응답 문항 수",data:s.ans,backgroundColor:"#7aa7f5",borderRadius:6}
    ]},
    options:{plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,title:{display:true,text:"문항 수"}}}}});
}
document.getElementById("gname").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
</script></body></html>
