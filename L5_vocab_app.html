function checkSentence(txt,item){
  const t=(txt||"").trim();
  const words=t?t.split(/\s+/).length:0;
  const used=WORDS.filter(w=>new RegExp("\\b"+w.w+"\\w*\\b","i").test(t)).map(w=>w.w);
  return {words, used, rule:item.rule.re.test(t),
          full:/[.!?]\s*$/.test(t)&&words>=5};
}

const levelFromPre=()=>{
  const k=Object.values(S.pre||{}).filter(Boolean).length/WORDS.length;
  return k<.30?1:k<.70?2:k<.90?3:4;
};
const curLevel=()=>LEVELS[(S.level||levelFromPre())-1];
function adjustLevel(rate){
  const old=S.level||levelFromPre();
  let next=old;
  if(rate>=.90&&old<4)next=old+1; else if(rate<.60&&old>1)next=old-1;
  S.level=next; return {old,next};
}

// ════ 세트 (한 번에 10문항씩) ══════════════════════════════
const SETSIZE=10;
function makeSets(a,size){const o=[];for(let i=0;i<a.length;i+=size)o.push(a.slice(i,i+size));return o}

// 세트 구성은 처음 한 번만 정해 고정한다. 그래야 '안 푼 세트'가 의미를 가진다.
// 첫 구성은 무작위 — 어려운 단어가 1세트에 몰리지 않게.
function ensureSets(slot,ids){
  if(!S[slot]) S[slot]={plan:null,results:[],first:[],attempts:0};
  const st=S[slot];
  if(!st.plan||!st.plan.length){
    st.plan=makeSets(shuffle(ids),SETSIZE);
    st.results=st.plan.map(()=>null);
    st.first=st.plan.map(()=>null);
    save();
  }
  return st;
}
function agg(st){
  if(!st||!st.plan) return null;
  let score=0,total=0,fscore=0,ftotal=0,wrong=[],fwrong=[];
  st.results.forEach((r,i)=>{ if(r){score+=r.score; total+=st.plan[i].length; wrong=wrong.concat(r.wrong||[])} });
  st.first.forEach((r,i)=>{ if(r){fscore+=r.score; ftotal+=st.plan[i].length; fwrong=fwrong.concat(r.wrong||[])} });
  return {score,total,fscore,ftotal,wrong,fwrong,
          done:st.results.filter(Boolean).length, sets:st.plan.length};
}
// 다음에 풀 세트: 아직 안 푼 것 먼저, 다 풀었으면 점수가 가장 낮았던 것
function nextSet(st){
  const i=st.results.findIndex(r=>!r);
  if(i>=0) return i;
  let lo=0,best=1e9;
  st.results.forEach((r,k)=>{const p=r.score/st.plan[k].length; if(p<best){best=p;lo=k}});
  return lo;
}
function setMenu(st,label,onPick){
  const a=agg(st);
  return `<div class="card">
    <h2>${label} <span class="muted" style="font-weight:400">· ${a.done}/${a.sets}세트 완료</span></h2>
    <p class="muted">한 세트는 ${SETSIZE}문항, 3~4분이면 끝나요.
      세트를 마치면 저장되고 <b>거기서 제출해도 됩니다.</b> 다음에 오면 안 푼 세트부터 나와요.</p>
    <div style="height:6px"></div>
    ${st.plan.map((s,i)=>{
      const r=st.results[i], nx=nextSet(st)===i;
      return `<button class="opt" data-s="${i}" style="display:flex;justify-content:space-between;align-items:center">
        <span><b>${i+1}세트</b> <span class="muted">${s.length}문항</span></span>
        <span>${r?`${r.score}/${s.length} ✓`:nx?`<b style="color:#1f6feb">지금 풀기 →</b>`:`<span class="muted">아직</span>`}</span>
      </button>`}).join("")}
  </div>`;
}
function weighted(list,key){
  return shuffle(list).sort((a,b)=>((S.miss||{})[key(b)]||0)-((S.miss||{})[key(a)]||0));
}
// 철자 판정.
// 편집거리 1이어도 정답으로 인정하지 않는다 — refuse/reuse, blood/flood, dancer/danger처럼
// 뜻이 전혀 다른 진짜 단어가 통과해 버리기 때문. "near"는 격려 문구와 기록용일 뿐 오답이다.
function near(a,b){
  a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
  if(a===b) return "exact";
  if(Math.abs(a.length-b.length)>1) return "";
  const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]<=1?"near":"";
}

  if(n>=2&&!S.pre) return ["먼저 <b>사전점검</b>에서 아는 단어를 체크하세요.",1];

function mergeCounts(st,field){
  const out={};
  (st&&st.results||[]).forEach(r=>{ if(!r||!r[field])return;
    Object.entries(r[field]).forEach(([k,v])=>{
      out[k]=out[k]||{ok:0,n:0}; out[k].ok+=v.ok; out[k].n+=v.n; }); });
  return out;
}

function open(n){
  if(inQuiz&&!confirm("지금 나가면 풀던 문제가 저장되지 않아요. 나갈까요?")) return;
  inQuiz=false;
  const L=locked(n);

  banner.innerHTML=""; cur=n; drawSteps();
  [start,preCheck,wordTab,chunkTab,transTab,writeTab,reflectTab,historyTab,submitTab][n]();

}

// ════ 공통 퀴즈 엔진 ═══════════════════════════════════════
function runQuiz(cfg){
  inQuiz=true;
  let i=0, ok=0, wrong=[], t0=Date.now();
  const step=()=>{
    if(i>=cfg.items.length){ inQuiz=false; S.prog=null; save(); return cfg.onDone({score:ok,total:cfg.items.length,wrong}); }
    const q=cfg.render(cfg.items[i],i); t0=Date.now();
    S.prog={kind:cfg.kind,i,ok,wrong}; save();
    view.innerHTML=`
      <div class="prog"><i style="width:${(i+1)/cfg.items.length*100}%"></i></div>
      <div class="count">${i+1} / ${cfg.items.length}${ok?" · 맞은 개수 "+ok:""}${cfg.badge?" · "+cfg.badge:""}</div>
      <div style="height:11px"></div>
      <div class="card">
        <div class="q">${q.text}</div>
        ${q.input
          ? `<input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="영어로 쓰세요">
             <div style="height:10px"></div>
             <div class="row"><button class="b" id="ok" style="margin:0">확인</button>
             <button class="b g" id="skip" style="margin:0">모르겠어요</button></div>`
          : `<div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
             <button class="b g sm" id="skip" style="margin:4px 0 0">모르겠어요</button>
             <div class="muted" style="margin-top:6px;text-align:center">
               찍지 말고 눌러도 돼요. 이 단어는 다음에 먼저 나옵니다.</div>`}
        <div id="fb"></div>
      </div>`;
    const finish=(pick,good,head,tone,flag)=>{
      const ms=Date.now()-t0;
      if(good) ok++;
      else wrong.push(Object.assign({picked:pick||"(모름)",ms,flag:flag||""},q.meta));
      document.getElementById("fb").innerHTML=
        `<div class="fb ${good?"ok":(tone||"no")}">${head||(good?"정답!":`정답은 <b>${esc(q.answer)}</b>`)}
          ${q.after?`<br>${q.after}`:""}</div>
         <div style="height:10px"></div><button class="b" id="nx" style="margin:0">다음</button>`;
      document.getElementById("nx").onclick=()=>{i++;step()};
    };
    if(q.input){
      const ti=document.getElementById("ti"), okb=document.getElementById("ok");
      const lock=()=>{ti.disabled=true;okb.disabled=true;document.getElementById("skip").disabled=true};
      const go=()=>{
        const v=ti.value.trim();
        if(!v){ document.getElementById("fb").innerHTML=
          `<div class="fb wa">답을 쓴 뒤 확인을 누르세요. 모르겠으면 <b>모르겠어요</b>를 누르면 정답을 알려줄게요.</div>`;
          return ti.focus(); }
        if(/[ㄱ-ㅎ가-힣]/.test(v)){ document.getElementById("fb").innerHTML=
          `<div class="fb wa">한글로 입력됐어요. 키보드를 <b>영어</b>로 바꾼 뒤 다시 써 주세요.</div>`;
          ti.value=""; return ti.focus(); }
        const m=near(v,q.answer); lock();
        if(m==="exact") finish(v,true,"정답!");
        else if(m==="near") finish(v,false,
          `아깝다! 철자가 조금 달라요. 정답은 <b>${esc(q.answer)}</b>`,"wa","near");
        else finish(v,false);
      };
      okb.onclick=go;
      document.getElementById("skip").onclick=()=>{lock();
        finish("",false,`괜찮아요. 정답은 <b>${esc(q.answer)}</b>`,"wa","skip")};
      ti.onkeydown=e=>{ if(e.isComposing||e.keyCode===229) return; if(e.key==="Enter") go(); };
      ti.focus();
    }else{
      const skb=document.getElementById("skip");
      const shut=()=>{ view.querySelectorAll(".opt").forEach(x=>x.disabled=true); skb.disabled=true; };
      view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const pick=q.opts[+b.dataset.k], good=pick===q.answer;
        shut();
        view.querySelectorAll(".opt").forEach((x,k)=>{
          if(q.opts[k]===q.answer)x.classList.add("ok"); else if(x===b)x.classList.add("no")});
        finish(pick,good);
      });
      skb.onclick=()=>{
        shut();
        view.querySelectorAll(".opt").forEach((x,k)=>{ if(q.opts[k]===q.answer)x.classList.add("ok") });
        finish("(모르겠어요)",false,`솔직하게 눌렀네요. 정답은 <b>${esc(q.answer)}</b>`,"wa","skip");
      };
    }
  };
  step();
}

function startWQuiz(si){
  const st=ensureSets("w",WORDS.map(c=>c.w)), L=curLevel();
  const list=st.plan[si].map(w=>WORDS.find(x=>x.w===w)).filter(Boolean);
  const n=list.length;
  const nType=Math.round(n*L.mix.type), nDef=Math.round(n*L.mix.def);
  const kinds=[...Array(nType).fill("type"),...Array(nDef).fill("def")];
  while(kinds.length<n) kinds.push("ko");
  const mixed=shuffle(kinds.slice(0,n));
  // 재응시일 때만 전에 틀린 단어를 앞으로
  const order=st.results[si]?weighted(list,c=>c.w):shuffle(list);
  const items=order.map((c,i)=>({c,kind:mixed[i]}));
  runQuiz({items,kind:"word",badge:`${si+1}세트 · 난이도 ${L.n}단계`,
    render:({c,kind})=>{
      const base={answer:c.w,after:`<span style="font-style:italic">${esc(c.ex)}</span>`,
                  meta:{w:c.w,ko:c.ko,kind}};
      if(kind==="type") return Object.assign(base,{input:true,
        text:`<b>${esc(c.ko)}</b><br><span class="muted">이 뜻의 영어 단어를 직접 쓰세요. (${esc(c.pos)})</span>`});
      const opts=shuffle([c,...shuffle(WORDS.filter(x=>x.w!==c.w&&x.pos===c.pos)).slice(0,3)]);
      while(opts.length<4){ const f=WORDS.find(x=>x.w!==c.w&&!opts.includes(x)); if(!f)break; opts.push(f); }
      return Object.assign(base,{opts:shuffle(opts).map(x=>x.w),
        text:kind==="ko"?`뜻이 <b>${esc(c.ko)}</b>인 단어는?`
             :`<b>${esc(c.def)}</b><br><span class="muted">위 설명에 맞는 단어는?</span>`});
    },
    onDone:r=>{
      const byKind={ko:{ok:0,n:0},def:{ok:0,n:0},type:{ok:0,n:0}};
      items.forEach(it=>byKind[it.kind].n++);
      Object.keys(byKind).forEach(k=>byKind[k].ok=byKind[k].n);
      r.wrong.forEach(x=>{byKind[x.kind].ok--; noteMiss(x.w)});
      const adj=adjustLevel(r.score/r.total);
      const rec={score:r.score,wrong:r.wrong,byKind};
      if(!st.first[si]) st.first[si]=rec;          // 첫 시도는 덮어쓰지 않는다
      st.results[si]=rec; st.attempts=(st.attempts||0)+1; st.level=adj.old;
      S.history=S.history.concat([{t:Date.now(),kind:"word",set:si+1,
        score:r.score,total:r.total,level:adj.old}]);
      save(); wMode="menu"; drawSteps();
      const a=agg(st), left=st.results.filter(x=>!x).length;
      const nm={ko:"뜻→단어",def:"영영정의→단어",type:"직접 쓰기"};
      view.innerHTML=`
      <div class="card done"><div class="em">${face(r.score,r.total)}</div>
        <div class="mid">${si+1}세트 완료</div>
        <div class="big">${r.score} / ${r.total}</div>
        <div class="mid">${Object.keys(byKind).filter(k=>byKind[k].n)
          .map(k=>`${nm[k]} ${byKind[k].ok}/${byKind[k].n}`).join(" · ")}
          <br>누적 ${a.score}/${a.total} · ${a.done}/${a.sets}세트</div>
        ${adj.next!==adj.old?`<div class="fb ${adj.next>adj.old?"ok":"wa"}" style="margin-top:12px">
          다음 세트는 <b>${LEVELS[adj.next-1].n}단계 ${LEVELS[adj.next-1].name}</b>
          — ${LEVELS[adj.next-1].desc}</div>`:""}
        ${r.wrong.length?`<div class="wrong"><b>다시 볼 단어</b><br>${
          r.wrong.map(x=>`${esc(x.w)} (${esc(x.ko)}) — ${esc(x.picked)}`).join("<br>")}</div>`:""}
      </div>
      ${left?`<button class="b" id="nx">${nextSet(st)+1}세트 이어서 풀기 (${SETSIZE}문항)</button>`
            :`<button class="b" id="go3">② 짝꿍 표현으로 가기</button>`}
      <button class="b g" id="menu">세트 목록으로</button>
      <button class="b g" id="sub">시간이 없어요 · 여기서 제출하기</button>`;
      const $=id=>document.getElementById(id);
      if($("nx")) $("nx").onclick=()=>startWQuiz(nextSet(st));
      if($("go3")) $("go3").onclick=()=>open(3);
      $("menu").onclick=()=>{wMode="menu";wordTab()};
      $("sub").onclick=()=>open(SUBMIT_STEP);
    }});
}

function startCQuiz(si){
  const st=ensureSets("c",CHUNKS.map((_,i)=>i));
  const items=shuffle(st.plan[si].map(i=>CHUNKS[i]));
  const forms=CHUNKS.map(c=>c[1]);
  runQuiz({items,kind:"chunk",badge:`${si+1}세트`,
    render:([sent,ans,base,type])=>{
      const opts=shuffle([ans,...shuffle(forms.filter(f=>f!==ans)).slice(0,3)]);
      const full=WORDS.find(w=>w.w===base);
      return {text:sent.replace("______","<b>______</b>"),opts,answer:ans,
              after:full?`덩어리: <b>${esc(full.col)}</b>`:"",meta:{w:base,type}};
    },
    onDone:r=>{
      const byType={adj:{ok:0,n:0},verb:{ok:0,n:0},prep:{ok:0,n:0}};
      items.forEach(([,,,t])=>{(byType[t]=byType[t]||{ok:0,n:0}).n++});
      Object.keys(byType).forEach(t=>byType[t].ok=byType[t].n);
      r.wrong.forEach(x=>{byType[x.type].ok--; noteMiss(x.w)});
      const rec={score:r.score,wrong:r.wrong,byType};
      if(!st.first[si]) st.first[si]=rec;
      st.results[si]=rec; st.attempts=(st.attempts||0)+1;
      S.history=S.history.concat([{t:Date.now(),kind:"chunk",set:si+1,score:r.score,total:r.total}]);
      save(); cMode="menu"; drawSteps();
      const a=agg(st), left=st.results.filter(x=>!x).length;
      view.innerHTML=`
      <div class="card done"><div class="em">${face(r.score,r.total)}</div>
        <div class="mid">${si+1}세트 완료</div>
        <div class="big">${r.score} / ${r.total}</div>
        <div class="mid">누적 ${a.score}/${a.total} · ${a.done}/${a.sets}세트</div>
        ${r.wrong.length?`<div class="wrong"><b>다시 볼 덩어리</b><br>${
          r.wrong.map(x=>{const f=WORDS.find(w=>w.w===x.w);
            return `${esc(f?f.col:x.w)} — ${esc(x.picked)}`}).join("<br>")}</div>`:""}
      </div>
      ${left?`<button class="b" id="nx">${nextSet(st)+1}세트 이어서 풀기</button>`
            :`<button class="b" id="go4">③ 처음 보는 말로 가기</button>`}
      <button class="b g" id="menu">세트 목록으로</button>
      <button class="b g" id="sub">시간이 없어요 · 여기서 제출하기</button>`;
      const $=id=>document.getElementById(id);
      if($("nx")) $("nx").onclick=()=>startCQuiz(nextSet(st));
      if($("go4")) $("go4").onclick=()=>open(4);
      $("menu").onclick=()=>{cMode="menu";chunkTab()};
      $("sub").onclick=()=>open(SUBMIT_STEP);
    }});
}

function startTQuiz(){
  const items=shuffle(TRANSFER);
  runQuiz({items,kind:"transfer",
    render:([w,pre,sense,sent,ans,bad])=>({
      text:`${esc(sent).replace(w,`<b>${w}</b>`)}
            <br><span class="muted">굵게 쓴 <b>${esc(w)}</b>의 뜻은 무엇일까요?</span>`,
      opts:shuffle([ans,...bad]),answer:ans,
      after:`<b>${esc(pre)}</b> 가 여기서는 <b>${esc(sense)}</b> 라는 뜻이에요 →
             ${esc(w)} = ${esc(ans)}`,
      meta:{w,pre}}),
    onDone:r=>{
      const byPre={};
      items.forEach(([,p])=>{(byPre[p]=byPre[p]||{ok:0,n:0}).n++});
      Object.keys(byPre).forEach(p=>byPre[p].ok=byPre[p].n);
      r.wrong.forEach(x=>{byPre[x.pre].ok--; noteMiss(x.w)});
      const prev=S.t;
      S.t={score:r.score,total:r.total,first:prev?prev.first:r.score,
           best:Math.max(prev?prev.best||0:0,r.score),
           attempts:(prev?prev.attempts:0)+1,wrong:r.wrong,byPre};
      S.history=S.history.concat([{t:Date.now(),kind:"transfer",score:r.score,total:r.total}]);
      save(); drawSteps();
      view.innerHTML=`
      <div class="card done"><div class="em">${face(r.score,r.total)}</div>
        <div class="big">${r.score} / ${r.total}</div>
        <div class="mid">${Object.entries(byPre).map(([k,v])=>`${k} ${v.ok}/${v.n}`).join(" · ")}</div>
        <div class="fb wa" style="margin-top:12px;text-align:left">
          같은 <b>under-</b> 라도 뜻이 하나가 아니에요.
          <b>underpass</b>는 '아래', <b>underweight</b>는 '기준보다 적은'입니다.
          앞부분만 보고 단정하지 말고 <b>문장 전체</b>를 함께 보세요.</div>
        ${r.wrong.length?`<div class="wrong"><b>다시 볼 단어</b><br>${

      document.getElementById("ag").onclick=startTQuiz;
      document.getElementById("nx2").onclick=()=>open(5);
    }});
}

function compare(){
  const st=S.w;
  if(!st||!st.plan) return null;
  // 첫 시도 기준. 아직 안 푼 세트의 단어는 판정에서 제외한다.
  const judged=new Set(), wrongSet=new Set();
  st.first.forEach((r,i)=>{ if(!r) return;
    st.plan[i].forEach(w=>judged.add(w));
    (r.wrong||[]).forEach(x=>wrongSet.add(x.w)); });
  const g={kw:[],ku:[],uk:[],uu:[],pending:0};
  WORDS.forEach(c=>{
    if(!judged.has(c.w)){ g.pending++; return; }
    const said=!!(S.pre&&S.pre[c.w]), missed=wrongSet.has(c.w);
    if(said&&!missed)g.kw.push(c.w); else if(said&&missed)g.ku.push(c.w);
    else if(!said&&!missed)g.uk.push(c.w); else g.uu.push(c.w);
  });
  return g;
}

}

function payload(){
  const g=compare(), aw=agg(S.w), ac=agg(S.c), wk=mergeCounts(S.w,"byKind");
  const wi=wrItems().items;
  const whyStr=d=>d.why?[(d.why.tags||[]).join("/"),d.why.note].filter(Boolean).join(" — "):"";
  const conf=a=>(a||[]).map(x=>`${x.w}>${x.picked}`).join(" | ");
  const bits=WORDS.map(c=>(S.pre&&S.pre[c.w])?"1":"0").join("");
  const p={
    unit:UNIT.id, sid:S.sid,
    cls:S.cls, no:S.no, name:S.name,
    pre_known:Object.values(S.pre||{}).filter(Boolean).length,
    pre_bits:bits,
    level_start:levelFromPre(), level_now:S.level||levelFromPre(),
    attempts:(S.history||[]).length,
    w_sets:aw?`${aw.done}/${aw.sets}`:"", w_score:aw?`${aw.score}/${aw.total}`:"",
    w_first:aw?`${aw.fscore}/${aw.ftotal}`:"",
    w_ko:fmt(wk.ko), w_def:fmt(wk.def), w_type:fmt(wk.type),
    w_conf:aw?conf(aw.wrong):"",
    w_spell:aw?aw.wrong.filter(x=>x.flag==="near").map(x=>`${x.w}(${x.picked})`).join(" "):"",
    skips:[aw&&aw.wrong,ac&&ac.wrong,S.t&&S.t.wrong].filter(Boolean)
            .reduce((n,a)=>n+a.filter(x=>x.flag==="skip").length,0),
    skip_words:[...new Set([aw&&aw.wrong,ac&&ac.wrong,S.t&&S.t.wrong].filter(Boolean)
            .flat().filter(x=>x.flag==="skip").map(x=>x.w))].join(" "),
    c_sets:ac?`${ac.done}/${ac.sets}`:"", c_score:ac?`${ac.score}/${ac.total}`:"",
    c_first:ac?`${ac.fscore}/${ac.ftotal}`:"", c_conf:ac?conf(ac.wrong):"",
    t_best:S.t?S.t.best:"", t_pre:S.t?Object.entries(S.t.byPre).map(([k,v])=>`${k} ${v.ok}/${v.n}`).join(" · "):"",
    t_conf:S.t?conf(S.t.wrong):"",
    wr_done:`${wrDone()}/${WRITE.length}`,
    wr_rules:WRITE.map((it,i)=>wi[i].text
      ? `${it.tag} ${checkSentence(wi[i].revised||wi[i].text,it).rule?"O":"X"}` : `${it.tag} -`).join(" · "),
    wr_vocab:WRITE.reduce((s,it,i)=>s+(wi[i].text
      ? checkSentence(wi[i].revised||wi[i].text,it).used.length : 0),0),
    wr_s1:wi[0].text, wr_s2:wi[1].text, wr_s3:wi[2].text, wr_s4:wi[3].text,
    wr_rev:WRITE.map((it,i)=>wi[i].revised?`${it.tag}: ${wi[i].revised}`:"").filter(Boolean).join(" || "),
    wr_why_cause:whyStr(wi[0]), wr_why_emph:whyStr(wi[3]),
    repeat_miss:Object.entries(S.miss||{}).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1])
                  .map(([w,n])=>`${w}x${n}`).join(" "),
    known_wrong:g?g.ku.join(" "):"",
    reflect1:S.reflect.a, reflect2:S.reflect.b
  };
  return p;
}
async function send(P,tries=4){
  for(let i=0;i<tries;i++){
    try{
      const opt={method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:new URLSearchParams(P).toString()};
      if(window.AbortSignal&&AbortSignal.timeout) opt.signal=AbortSignal.timeout(45000);
      const r=await fetch(POST_URL,opt);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||"server");
      return j;
    }catch(e){
      if(i===tries-1) throw e;
      await new Promise(s=>setTimeout(s,(2**i)*2000+Math.random()*3000));
    }
  }
}

                      if(c[0].indexOf("______")<0) bad.push("빈칸 없음: "+c[0]); });
  TRANSFER.forEach(t=>{ if(t[5].length!==3) bad.push("오답 3개 아님: "+t[0]);
                        if(t[3].indexOf(t[0])<0) bad.push("문장에 단어 없음: "+t[0]); });
  if(bad.length){ document.body.innerHTML=
    "<pre style='padding:20px;white-space:pre-wrap'>⚠ 데이터 오류\n\n"+bad.join("\n")+"</pre>"; return; }
  drawSteps();
  open(S.name?(S.pre?2:1):0);
})();
</script>
